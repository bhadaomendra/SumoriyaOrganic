name: Restore Home CSS

on:
  push:
    branches:
      - homepage-final-design

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore locked home page stylesheet [auto]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore home stylesheet from locked commit
        run: |
          git checkout 3cd154d2246e6d364fd4bbe3be9c9704ff622bdb -- src/index.css
          if git diff --quiet -- src/index.css; then
            echo "Home CSS already matches locked version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git commit -m "Restore locked home page stylesheet [auto]"
          git push
